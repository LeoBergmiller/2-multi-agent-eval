[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-eval"
version = "0.1.0"
description = "Multi-agent healthcare operations analyst with trajectory-first evaluation"
requires-python = "==3.12.*"

# Floors state the major we actually build and test against, not the oldest
# version that might work. uv.lock carries the exact resolution.
dependencies = [
    # Orchestration
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    # LLM client (cassette seam 1)
    "anthropic>=0.120",
    # MCP server + client (cassette seam 2)
    "mcp>=2.0",
    # Warehouse + SQL guards
    "duckdb>=1.5",
    "sqlglot>=30.14",
    # Contracts + config
    "pydantic>=2.13",
    "pyyaml>=6.0",
    # Telemetry
    "opentelemetry-sdk>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-pyyaml>=6.0",
]

# Floors above are declared intent; `uv.lock` carries the exact resolution and is
# committed. Cassettes pin what the models returned, not what langgraph and mcp
# resolve to — a version drift that broke replay would present as a cassette bug.
# See D22.

[project.optional-dependencies]
# Project 1's retrieval core, behind `search_metric_definitions`. Git-pinned to a TAG,
# never a local path (§5) — an absolute path breaks CI and every clone.
#
# v0.2.0 is the first tag that can be installed here at all: before it, rag-eval
# declared `anthropic==0.109.1` as a hard runtime dependency, which is unsatisfiable
# against this project's `anthropic>=0.120`, and its registry imported the LangChain
# generation stack on every path. v0.2.0 splits that behind a `full` extra, so what
# lands here is the framework-free retrieval core only. See D24.
#
# CI NEVER INSTALLS THIS. The blocking gate runs entirely from cassettes and must not
# need P1, an index, a model download, or the network.
rag = ["rag-eval @ git+https://github.com/LeoBergmiller/rag-evaluation@v0.2.0"]

[tool.hatch.metadata]
# Required for the git-pinned `rag` extra: hatchling rejects a direct URL reference in
# project metadata unless this is explicitly opted into. Scoped to that one dependency —
# every other dependency resolves from the index and is pinned by uv.lock.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Two package roots: the system under test and the harness that measures it.
# They are deliberately not in one namespace — see D22.
packages = ["src/analyst", "evals"]

[tool.ruff]
line-length = 88
target-version = "py312"
# ruff formats Python embedded in Markdown. docs/architecture.md and
# docs/decisions.md are locked specification documents whose code blocks are
# illustrative — reformatting them produces spurious churn in a spec and buries
# real edits. Never let the formatter touch prose.
extend-exclude = ["docs/", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any is legitimate in the span-attribute and findings surfaces
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["analyst", "evals"]

[[tool.mypy.overrides]]
# These ship incomplete or absent stubs; we still type our own call sites.
module = ["duckdb.*", "langgraph.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `rag_eval` is an OPTIONAL extra with no py.typed marker, so it is untyped when
# present and absent entirely in CI. `follow_untyped_imports` covers the first case,
# `ignore_missing_imports` the second — mypy must give the same answer either way, or
# the type check would depend on whether someone happened to run `make install-rag`.
module = ["rag_eval.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "integration: load-bearing end-to-end tests (replay hermeticity, cassette miss)",
]
