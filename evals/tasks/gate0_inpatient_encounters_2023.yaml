# Gate 0 task.
#
# ADMISSIBILITY (architecture.md §2): a task is admissible only if its ground
# truth is fully determined by (reference SQL + the metrics dictionary). The
# metrics dictionary is a Gate 1 deliverable, so at Gate 0 that reduces to
# reference SQL alone — which is why this task names its encounter class
# explicitly and avoids every definition-laden term. No "admission", no length
# of stay, no readmission window. Those arrive with the dictionary.
#
# The task is still non-trivial. Ignoring ENCOUNTERCLASS returns 9867 against the
# Synthea warehouse. The traps are in the SQL, not in the definition.
#
# STATUS AT GATE 1a STEP 2: the fixture warehouse this task was verified against
# has been deleted and replaced by seeded Synthea. Per the carried rule in
# CLAUDE.md the ground truth therefore returns to `draft` and does not count
# until a human re-signs it. The still-admitted trap is gone for now — Synthea
# closes every encounter (STOP IS NULL = 0) — and returns in step 3 when
# messify.py injects it.

id: gate0_inpatient_encounters_2023
prompt: >-
  How many inpatient encounters started in 2023?

# --- HUMAN-OWNED (architecture.md §13, D17) ---------------------------------
# reference_sql and ground_truth are human-verified artifacts. The coding agent
# may draft and execute them; a human signs off before they become canonical.
ground_truth:
  # DRAFT CANDIDATE, executed but NOT signed off. 133 is what reference_sql
  # returns against the seeded Synthea warehouse; 37 was the fixture-era number
  # and died with the fixture.
  value: 133
  tolerance: 0

  # Returned to draft at Gate 1a step 2, exactly as the Gate 0 sign-off said it
  # would be. `require_verified_ground_truth` (config/eval.yaml) means the
  # harness still SCORES this task but refuses to count it as a pass, so an
  # unreviewed number cannot quietly turn the gate green. That is the guard
  # doing its job, not a regression.
  #
  # Also note the committed cassettes are fixture-era: a replayed run still
  # answers 37. Re-recording happens in step 7 together with the seed tasks, and
  # is this gate's one real `make record`.
  status: draft

  verification:
    # NB: `date:`, not `on:` — YAML 1.1 parses a bare `on` key as boolean True,
    # which silently loses the audit date.
    # Superseded: signed off 2026-08-03 against the fixture warehouse, which no
    # longer exists. Retained as a record of what was verified and when.
    - by: human
      date: 2026-08-03
      method: >-
        Against the DELETED CSV fixture warehouse. Confirmed 37 inpatient
        encounters with START in 2023, of which 6 had STOP IS NULL.
    - by: agent-draft
      date: 2026-08-06
      method: >-
        Executed reference_sql against the seeded Synthea warehouse
        (v4.0.0, seed 20260806, end_date 20260101, 2000 patients): 133 rows.
        Ignoring ENCOUNTERCLASS returns 9867. STOP IS NULL is 0 because Synthea
        closes every encounter; messify.py reintroduces open stays in step 3,
        which will change this number again. AWAITING HUMAN SIGN-OFF (D17) —
        and worth re-drafting after step 3 rather than signing twice.

reference_sql: |
  SELECT count(*) AS n
  FROM encounters
  WHERE ENCOUNTERCLASS = 'inpatient'
    AND START >= TIMESTAMP '2023-01-01'
    AND START <  TIMESTAMP '2024-01-01'

# --- Reference trajectory: a partial-order constraint set, not a golden path
# (architecture.md §7.2, D18). Recorded in full so the schema does not churn
# when the remaining metrics land, but at Gate 0 only ground_truth is scored.
required_tools: [run_sql]
forbidden_tools: [run_python]
required_order: []
min_steps: 2
must_cite: []
failure_injection: null
